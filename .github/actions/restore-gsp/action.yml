name: Restore GoogleService-Info.plist
description: Restaura o GoogleService-Info.plist a partir de base64 (com fallback opcional para conteúdo cru)
inputs:
  content:
    description: Conteúdo base64 do GoogleService-Info.plist (ou cru, se allow_raw=true)
    required: true
  output_path:
    description: Caminho de saída do arquivo plist
    required: false
    default: ./App/Sources/SupportingFiles/GoogleService-Info.plist
  allow_raw:
    description: Se true, aceita conteúdo cru (não-base64) como fallback
    required: false
    default: "false"
  validate:
    description: Se true, valida o plist com plutil (somente em sistemas macOS com plutil disponível)
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - id: restore
      shell: bash
      env:
        inputsContent: ${{ inputs.content }}
        inputsOutputPath: ${{ inputs.output_path }}
        inputsAllowRaw: ${{ inputs.allow_raw }}
        inputsValidate: ${{ inputs.validate }}
      run: |
        set -eo pipefail

        CONTENT="$inputsContent"
        OUT="$inputsOutputPath"
        ALLOW_RAW="$inputsAllowRaw"
        VALIDATE="$inputsValidate"

        # Pasta destino
        mkdir -p "$(dirname "$OUT")"

        # Remove espaços/quebras e ajusta padding (base64 robusto)
        CLEAN="$(printf '%s' "$CONTENT" | tr -d '\r\n[:space:]')"
        # Calcula o padding necessário para base64: base64 exige que o comprimento seja múltiplo de 4, então adiciona '=' conforme necessário
        LEN=${#CLEAN}; PAD=$(( (4 - (LEN % 4)) % 4 )); PADDED="$CLEAN$(printf '=%.0s' $(seq 1 $PAD))"
        # Tenta decodificar como base64.
        # Usa '-D' para macOS e '--decode' para GNU base64, garantindo portabilidade entre sistemas.
        if printf '%s' "$PADDED" | base64 -D > "$OUT" 2>/dev/null || printf '%s' "$PADDED" | base64 --decode > "$OUT" 2>/dev/null; then
          echo "📦 Restaurado via base64 em $OUT"
        else
          if [ "$ALLOW_RAW" = "true" ]; then
            printf '%s' "$CONTENT" > "$OUT"
            echo "ℹ️ Conteúdo não parecia base64 — gravado como cru em $OUT (allow_raw=true)."
            echo "⚠️ A decodificação base64 falhou, mas allow_raw=true permite gravar o conteúdo cru; prosseguindo."
          else
            echo "❌ Falha ao decodificar base64 e allow_raw!=true; nenhum arquivo foi gravado em $OUT."
            echo "Dica: gere com 'base64 -i GoogleService-Info.plist | tr -d \"\\n[:space:]\"' para garantir que o resultado seja uma única linha sem espaços."
            exit 1
          fi
        fi

        # Validação (apenas no macOS; plutil)
        if [ "$VALIDATE" = "true" ]; then
          if command -v plutil >/dev/null 2>&1; then
            if ! plutil -lint "$OUT" >/dev/null 2>&1; then
              echo "❌ Arquivo gerado não é um plist válido: $OUT"
              exit 1
            fi
            echo "✅ plist validado com plutil."
          else
            echo "⚠️ plutil não disponível; pulando validação."
          fi
        fi

        echo "✅ GoogleService-Info.plist restaurado em: $OUT"
