name: iOS Deploy to TestFlight

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: src

jobs:
  deploy_testflight:
    name: 🚀 Deploy to TestFlight
    runs-on: macos-15

    env:
      APPLE_MOBILEPROVISION: ${{ secrets.APPLE_MOBILEPROVISION }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('src/**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Install dependencies
        run: |
          gem install bundler
          bundle config set path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      # ✅ Recria o GoogleService-Info.plist (Firebase)
      - name: Create GoogleService-Info.plist (from B64 secret)
        shell: bash
        run: |
          set -eo pipefail
          : "${GOOGLE_SERVICE_INFO_PLIST:?Faltou GOOGLE_SERVICE_INFO_PLIST}"
          mkdir -p ./App/Sources/SupportingFiles
          if ! printf "%s" "$GOOGLE_SERVICE_INFO_PLIST" | base64 -D > ./App/Sources/SupportingFiles/GoogleService-Info.plist 2>/dev/null; then
            printf "%s" "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ./App/Sources/SupportingFiles/GoogleService-Info.plist
          fi
          echo "✅ GoogleService-Info.plist restaurado."
      # 🚀 Faz o deploy (usa a lane Fastlane deploy_testflight)

      - name: Run Fastlane deploy_testflight
        run: bundle exec fastlane deploy

      # 🧹 Limpeza opcional
      - name: Cleanup
        if: always()
        run: rm -f .env
