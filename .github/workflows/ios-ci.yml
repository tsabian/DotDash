name: iOS CI/CD Pipeline Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false
  

# 🧭 define o diretório de trabalho global (todos os comandos rodam em src/)
defaults:
  run:
    working-directory: src

jobs:
  # 🧱 Build release - roda somente após o merge na main
  build_release:
    name: 🧱 Build (release)
    runs-on: macos-15
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    
    # 🔐 Segredos injetados direto no ambiente
    env:
      APPLE_MOBILEPROVISION: ${{ secrets.APPLE_MOBILEPROVISION }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_SECRET_WORD: ${{ secrets.APPLE_CERTIFICATE_SECRET_WORD }}
      APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
      
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Install dependencies
        run: |
          gem install bundler
          bundle config set path 'vendor/bundle'
          bundle install --jobs 4 --retry 3 || bundle install

      # ✅ Recria o GoogleService-Info.plist (Firebase)
      - name: Create GoogleService-Info.plist (from B64 secret)
        shell: bash
        run: |
          set -eo pipefail
          : "${GOOGLE_SERVICE_INFO_PLIST:?Faltou GOOGLE_SERVICE_INFO_PLIST}"
          mkdir -p ./App/Sources/SupportingFiles
          if ! printf "%s" "$GOOGLE_SERVICE_INFO_PLIST" | base64 -D > ./App/Sources/SupportingFiles/GoogleService-Info.plist 2>/dev/null; then
            printf "%s" "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ./App/Sources/SupportingFiles/GoogleService-Info.plist
          fi
          echo "✅ GoogleService-Info.plist restaurado."

      # ✅ Gera o projeto Xcode e resolve dependências
      - name: Setup project (make setup)
        run: |
          make clean
          make setup

      - name: Load Apple certificate (.p12) and configure keychain
        shell: bash
        run: |
          set -eo pipefail
          : "${APPLE_CERTIFICATE_P12:?Faltou APPLE_CERTIFICATE_P12}"
          : "${APPLE_CERTIFICATE_SECRET_WORD:?Faltou APPLE_CERTIFICATE_SECRET_WORD}"

          mkdir -p temp
          if ! printf "%s" "$APPLE_CERTIFICATE_P12" | base64 -D > temp/cert.p12 2>/dev/null; then
            printf "%s" "$APPLE_CERTIFICATE_P12" | base64 --decode > temp/cert.p12
          fi

          # keychain dedicado ao build
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import temp/cert.p12 -k ~/Library/Keychains/build.keychain -P "$APPLE_CERTIFICATE_SECRET_WORD" -T /usr/bin/codesign
          # permite codesign/xcodebuild acessarem a chave
          security set-key-partition-list -S apple-tool:,apple: -k "" ~/Library/Keychains/build.keychain

          echo "✅ Certificado importado e keychain configurado."

      - name: (Optional) Create App Store Connect key (.p8) for Fastlane
        if: ${{ env.APP_STORE_CONNECT_KEY_CONTENT != '' && env.APP_STORE_CONNECT_ISSUER_ID != '' }}
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p temp
          KEY_PATH="temp/AuthKey_${APP_STORE_CONNECT_ISSUER_ID}.p8"
          if ! printf "%s" "$APP_STORE_CONNECT_KEY_CONTENT" | base64 -D > "$KEY_PATH" 2>/dev/null; then
            printf "%s" "$APP_STORE_CONNECT_KEY_CONTENT" | base64 --decode > "$KEY_PATH"
          fi
          echo "APP_STORE_CONNECT_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV
          echo "✅ AuthKey criado em $KEY_PATH"

      # 🧱 Executa a lane de build do Fastlane (com assinatura)
      - name: Fastlane release
        run: bundle exec fastlane build

      # 💻 Debug: show where artifacts are (helps if upload fails)
      - name: "Debug list build artifacts"
        shell: bash
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "Looking for build directories..."
          if [ -d "$GITHUB_WORKSPACE/src/build" ]; then
            echo "Found src/build:"
            ls -la "$GITHUB_WORKSPACE/src/build" || true
          fi
          if [ -d "$GITHUB_WORKSPACE/build" ]; then
            echo "Found build:"
            ls -la "$GITHUB_WORKSPACE/build" || true
          fi
          echo "Also searching recursively for .ipa and dSYM files:" 
          find "$GITHUB_WORKSPACE" -type f \( -name "*.ipa" -o -name "*.dSYM.zip" \) -maxdepth 4 -print || true

      # 📦 Armazena os artefatos para o deploy (paths are relative to $GITHUB_WORKSPACE)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            src/build/*.ipa
            src/build/*.dSYM.zip

        # 🧹 Limpa arquivos sensíveis no final
      - name: Cleanup secrets files, keychain and provisioning files
        if: always()
        shell: bash
        run: |
          set -eo pipefail
          rm -f ./App/Sources/SupportingFiles/GoogleService-Info.plist || true
          rm -rf temp || true
          security delete-keychain build.keychain || true
          make clean
          echo "🧹 Keychain e arquivos temporários limpos."
