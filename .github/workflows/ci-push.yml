name: iOS Build on Push

on:
  push:
    branches-ignore: [main]

defaults:
  run:
    working-directory: src

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
# 🧱 Build job - roda em todo commit
  build_on_push:
    name: 🧱 Build (commit)
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Install dependencies
        run: |
          gem install bundler
          bundle config set path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      # ✅ Gera o projeto Xcode e resolve dependências
      - name: Setup project (make setup)
        run: |
          make clean
          make setup        

      # Executa a lane de build do Fastlane (sem assinatura)
      - name: Fastlane build
        run: bundle exec fastlane ci_build
