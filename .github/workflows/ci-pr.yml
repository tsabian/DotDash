name: iOS Tests on Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 🧭 define o diretório de trabalho global (todos os comandos rodam em src/)
defaults:
  run:
    working-directory: src

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # ✅ Test job - roda sempre que um PR é aberto ou atualizado para main
  test_on_pr:
    name: ✅ Tests (pull request)
    runs-on: macos-15
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    # 🔐 Segredos injetados direto no ambiente
    env:
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Install dependencies
        run: |
          gem install bundler
          bundle config set path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      # ✅ Recria o GoogleService-Info.plist (Firebase)
      - name: Create GoogleService-Info.plist (from B64 secret)
        shell: bash
        run: |
          set -eo pipefail
          : "${GOOGLE_SERVICE_INFO_PLIST:?Faltou GOOGLE_SERVICE_INFO_PLIST}"
          mkdir -p ./App/Sources/SupportingFiles
          if ! printf "%s" "$GOOGLE_SERVICE_INFO_PLIST" | base64 -D > ./App/Sources/SupportingFiles/GoogleService-Info.plist 2>/dev/null; then
            printf "%s" "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ./App/Sources/SupportingFiles/GoogleService-Info.plist
          fi
          echo "✅ GoogleService-Info.plist restaurado."

      # ✅ Gera o projeto Xcode e resolve dependências
      - name: Setup project (make setup)
        run: |
          make clean
          make setup              
      - name: Run Fastlane tests
        run: bundle exec fastlane test

    # 📦 Publica os resultados como artefatos
      - name: Upload test results (JUnit + HTML + XCResult)
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test_reports/report.junit
            build/test_reports/report.html
            build/test_reports/Test.xcresult
