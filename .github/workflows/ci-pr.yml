name: iOS Tests on Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# 🧭 define o diretório de trabalho global (todos os comandos rodam em src/)
defaults:
  run:
    working-directory: src

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  analyze:
      name: Analyze (${{ matrix.language }})
      # Runner size impacts CodeQL analysis time. To learn more, please see:
      #   - https://gh.io/recommended-hardware-resources-for-running-codeql
      #   - https://gh.io/supported-runners-and-hardware-resources
      #   - https://gh.io/using-larger-runners (GitHub.com only)
      # Consider using larger runners or machines with greater resources for possible analysis time improvements.
      runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
      permissions:
        # required for all workflows
        security-events: write

        # required to fetch internal or private CodeQL packs
        packages: read

        # only required for workflows in private repositories
        actions: read
        contents: read

      strategy:
        fail-fast: false
        matrix:
          include:
          - language: actions
            build-mode: none
          - language: ruby
            build-mode: none
          - language: swift
            build-mode: manual
          # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
          # Use `c-cpp` to analyze code written in C, C++ or both
          # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
          # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
          # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
          # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
          # If you are analyzing a compiled language, you can modify the 'build-mode' for that language to customize how
          # your codebase is analyzed, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
      steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Add any setup steps before running the `github/codeql-action/init` action.
      # This includes steps like installing compilers or runtimes (`actions/setup-node`
      # or others). This is typically only required for manual builds.
      # - name: Setup runtime (example)
      #   uses: actions/setup-example@v1

      - name: Set up Ruby
        uses: ruby/setup-ruby@6797dcbb9a1889fd411d07e8aba7eded53fb8b48
        with:
          ruby-version: '3.2' 

      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      
      - name: Install dependencies
        run: |
          gem install bundler
          bundle config set path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.

          # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          # queries: security-extended,security-and-quality

      # If the analyze step fails for one of the languages you are analyzing with
      # "We were unable to automatically build your code", modify the matrix above
      # to set the build mode to "manual" for that language. Then modify this step
      # to build your code.
      # ℹ️ Command-line programs to run using the OS shell.
      # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
      - if: matrix.language == 'swift' && matrix.build-mode == 'manual'
        name: Build code for manual analysis  
        shell: bash
        run: |
          set -eo pipefail
          ARCH_FLAG=""
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ] || [ "$ARCH" = "aarch64" ]; then
            ARCH_FLAG="--arch arm64"
          fi

          echo "Building Swift packages with ARCH_FLAG=$ARCH_FLAG"

          swift build --package-path Core $ARCH_FLAG
          swift build --package-path Components $ARCH_FLAG
          swift build --package-path iOS $ARCH_FLAG

          # Note: The watchOS package declares only iOS/watchOS platforms and cannot be built for the macOS host via `swift build`,
          # so we intentionally skip building it here to avoid CodeQL manual build failures.

          make install_tools_arm64
          make generate
          bundle exec fastlane ci_build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # ✅ Test job - roda sempre que um PR é aberto ou atualizado para main
  test_on_pr:
    name: ✅ Tests (pull request)
    runs-on: macos-15
    if: github.event_name == 'pull_request' && github.event.action != 'closed'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@6797dcbb9a1889fd411d07e8aba7eded53fb8b48
        with:
          ruby-version: '3.2'

      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Install dependencies
        run: |
          gem install bundler
          bundle config set path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      # ✅ Recria o GoogleService-Info.plist (Firebase)
      - name: Restore GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        uses: ./.github/actions/restore-gsp
        with:
          content: ${{ env.GOOGLE_SERVICE_INFO_PLIST }}
          output_path: src/App/DotDash/Sources/SupportingFiles/GoogleService-Info.plist
          allow_raw: "false"
          validate: "true"

      # ✅ Gera o projeto Xcode e resolve dependências
      - name: Setup project (make setup)
        run: |
          make clean
          make setup              
      - name: Run Fastlane tests
        run: bundle exec fastlane test

      # 📊 Gerar report de testes
      - name: 📊 Generate HTML report from .xcresult
        run: |
          set -eo pipefail
          root_dir="build/test_reports"
          echo "📊 Generating HTML report from .xcresult files..."
          echo "🔎 Searching for .xcresult files in build/test_reports..."
          find "$root_dir" -type d -name "*.xcresult" -print0 | 
          while IFS= read -r -d '' file; do
              echo "Found .xcresult at $file";
              if command -v xchtmlreport >/dev/null 2>&1; then
                  filenamewithoutextension=$(basename "$file" .xcresult)
                  path="$root_dir/$filenamewithoutextension"
                  echo "Generating report for $filenamewithoutextension"
                  mkdir -p "$path"
                  xchtmlreport "$file" --output "$path"
                  echo "✅ HTML report generated at $path"
              else
                  echo "❌ xchtmlreport is not installed. Please install it to generate HTML reports."
              fi
          done

      # 📦 Publica todos os resultados dentro da pasta src/build/test_reports recursivamente como artefatos
      - name: 📦 Upload test results (JUnit + HTML + XCResult)
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: src/build/test_reports/
          retention-days: 2

  quality_gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test_on_pr]

    steps:
      - uses: actions/checkout@v4

      - name: 📦 Download test results (JUnit + HTML + XCResult)
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: src/build/test_reports/

      - uses: actions/checkout@v4

      - name: 📦 Download test results (JUnit + HTML + XCResult)
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: src/build/test_reports/

      - name: Analyze with SonarCloud
        # You can pin the exact commit or the version.
        # uses: SonarSource/sonarcloud-github-action@v2.2.0
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Generate a token on Sonarcloud.io, add it to the secrets of this repo with the name SONAR_TOKEN (Settings > Secrets > Actions > add new repository secret)
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }} # Create a project in Sonarcloud.io, go to Project Settings > General Settings > Pull Requests and set the Key with the name SONAR_PROJECT_KEY
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }} # Create an organization in Sonarcloud.io, go to Organization Settings > General Settings and set the Key with
        with:
          projectBaseDir: src
          # Additional arguments for the SonarScanner CLI
          args:
            # Unique keys of your project and organization. You can find them in SonarCloud > Information (bottom-left menu)
            # mandatory
            -Dsonar.projectKey="$SONAR_PROJECT_KEY"
            -Dsonar.organization="$SONAR_ORGANIZATION"
            -Dsonar.coverageReportPaths=build/test_reports/sonarqube-generic-coverage.xml
            # Comma-separated paths to directories containing main source files.
            #-Dsonar.sources= # optional, default is project base directory
            # Comma-separated paths to directories containing test source files.
            #-Dsonar.tests= # optional. For more info about Code Coverage, please refer to https://docs.sonarcloud.io/enriching/test-coverage/overview/
            # Adds more detail to both client and server-side analysis logs, activating DEBUG mode for the scanner, and adding client-side environment variables and system properties to the server-side log of analysis report processing.
            #-Dsonar.verbose= # optional, default is false
          # When you need the analysis to take place in a directory other than the one from which it was launched, default is .
