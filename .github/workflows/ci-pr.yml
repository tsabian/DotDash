name: iOS Tests on Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 🧭 define o diretório de trabalho global (todos os comandos rodam em src/)
defaults:
  run:
    working-directory: src

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # ✅ Test job - roda sempre que um PR é aberto ou atualizado para main
  test_on_pr:
    name: ✅ Tests (pull request)
    runs-on: macos-15
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    # 🔐 Segredos injetados direto no ambiente

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Install dependencies
        run: |
          gem install bundler
          bundle config set path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      # ✅ Recria o GoogleService-Info.plist (Firebase)
      - name: Restore GoogleService-Info.plist
        uses: ./.github/actions/restore-gsp
        with:
          content: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          output_path: src/App/Sources/SupportingFiles/GoogleService-Info.plist
          allow_raw: "false"
          validate: "true"

      # ✅ Gera o projeto Xcode e resolve dependências
      - name: Setup project (make setup)
        run: |
          make clean
          make setup              
      - name: Run Fastlane tests
        run: bundle exec fastlane test

      # 📊 Gerar report de testes
      - name: 📊 Generate HTML report from .xcresult
        run: |
          set -eo pipefail
          root_dir="build/test_reports"
          echo "📊 Gerando relatório HTML dos testes..."
          echo "🔎 Searching for .xcresult files in build/test_reports..."
          find $root_dir -type d -name "*.xcresult" -print0 | 
          while IFS= read -r -d '' file; do
              echo "Found .xcresult at $file";
              if command -v xchtmlreport >/dev/null 2>&1; then
                  filenamewithoutextension=$(basename "$file" .xcresult)
                  path="$root_dir/$filenamewithoutextension"
                  echo "Generating report for $filenamewithoutextension"
                  mkdir -p $path
                  xchtmlreport "$file" --output "$path"
                  echo "✅ Relatório HTML gerado em $path"
              else
                  echo "❌ xchtmlreport is not installed. Please install it to generate HTML reports."
              fi
          done

      # 📦 Publica todos os resultados dentro da pasta src/build/test_reports recursivamente como artefatos
      - name: 📦 Upload test results (JUnit + HTML + XCResult)
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test_reports/
          retention-days: 2
