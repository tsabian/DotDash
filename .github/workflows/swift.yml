# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./src

    steps:
    - uses: actions/checkout@v4
    - name: setup
      run: make pipeline
    - name: build
      run: xcodebuild -project DotDash.xcodeproj -scheme DotDash -sdk iphonesimulator
    - name: test
      run: xcodebuild test -project DotDash.xcodeproj -scheme DotDash -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16e'
      